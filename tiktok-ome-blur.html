<!DOCTYPE html>
<html lang="pt-PT">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Ome.tv Live Overlay - @pedropaiva63</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --primary: #FF0050;
      --secondary: #FFFFFF;
      --bg: #000000;
      --accent: #00F2EA;
      --blur-radius: 8px;
      --font: system-ui, -apple-system, sans-serif;
      --vw: 10.8px;   /* 1080 / 100 */
      --vh: 19.2px;   /* 1920 / 100 */
    }
    @media (max-width: 1080px) {
      :root {
        --vw: calc(100vw / 100);
        --vh: calc(100vw * 1920 / 1080 / 100);
      }
    }
    @media (max-height: 1920px) {
      :root {
        --vh: calc(100vh / 100);
        --vw: calc(100vh * 1080 / 1920 / 100);
      }
    }
    body {
      width: 100vw;
      max-width: 100%;
      height: 100vh;
      max-height: 100%;
      background: var(--bg);
      font-family: var(--font);
      color: var(--secondary);
      overflow: hidden;
      position: relative;
      aspect-ratio: 1080 / 1920;
    }
    #ome-frame {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: none;
      background: #111;
      filter: blur(var(--blur-radius));
    }
    #webcam-container {
      position: absolute;
      top: calc(1240 * var(--vh) / 19.2);
      left: calc(680 * var(--vw) / 10.8);
      width: calc(360 * var(--vw) / 10.8);
      height: calc(640 * var(--vh) / 19.2);
      border-radius: calc(16 * var(--vw) / 10.8);
      border: calc(3 * var(--vw) / 10.8) solid var(--primary);
      overflow: hidden;
      box-shadow: 0 calc(8 * var(--vh) / 19.2) calc(32 * var(--vh) / 19.2) rgba(255, 0, 80, 0.4), 0 0 0 calc(1 * var(--vw) / 10.8) rgba(255, 255, 255, 0.1) inset;
      z-index: 10;
    }
    #webcam-container video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: rotateY(180deg);
    }
    .live-badge {
      position: absolute;
      top: calc(40 * var(--vh) / 19.2);
      left: calc(40 * var(--vw) / 10.8);
      background: var(--primary);
      color: var(--secondary);
      padding: calc(8 * var(--vh) / 19.2) calc(16 * var(--vw) / 10.8);
      border-radius: calc(8 * var(--vw) / 10.8);
      font-size: calc(28 * var(--vw) / 10.8);
      font-weight: 700;
      letter-spacing: calc(1 * var(--vw) / 10.8);
      z-index: 20;
      animation: pulse 2s ease-in-out infinite;
      box-shadow: 0 calc(4 * var(--vh) / 19.2) calc(20 * var(--vh) / 19.2) rgba(255, 0, 80, 0.6);
    }
    @keyframes pulse {
      0%, 100% { box-shadow: 0 calc(4 * var(--vh) / 19.2) calc(20 * var(--vh) / 19.2) rgba(255, 0, 80, 0.6); }
      50% { box-shadow: 0 calc(4 * var(--vh) / 19.2) calc(30 * var(--vh) / 19.2) rgba(255, 0, 80, 0.9); }
    }
    .handle-label {
      position: absolute;
      top: calc(100 * var(--vh) / 19.2);
      left: calc(40 * var(--vw) / 10.8);
      font-size: calc(22 * var(--vw) / 10.8);
      font-weight: 600;
      color: var(--secondary);
      text-shadow: 0 calc(2 * var(--vh) / 19.2) calc(8 * var(--vh) / 19.2) rgba(0, 0, 0, 0.8);
      z-index: 20;
    }
    .privacy-notice {
      position: absolute;
      bottom: calc(40 * var(--vh) / 19.2);
      left: calc(40 * var(--vw) / 10.8);
      font-size: calc(14 * var(--vw) / 10.8);
      color: #888;
      z-index: 20;
      max-width: calc(400 * var(--vw) / 10.8);
    }
    .connection-status {
      position: absolute;
      top: calc(40 * var(--vh) / 19.2);
      right: calc(40 * var(--vw) / 10.8);
      padding: calc(8 * var(--vh) / 19.2) calc(16 * var(--vw) / 10.8);
      border-radius: calc(8 * var(--vw) / 10.8);
      font-size: calc(14 * var(--vw) / 10.8);
      font-weight: 600;
      z-index: 20;
      background: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(calc(4 * var(--vw) / 10.8));
      border: calc(1 * var(--vw) / 10.8) solid #333;
    }
    .connection-status.connected {
      border-color: #00F2EA;
      color: #00F2EA;
    }
    .connection-status.disconnected {
      border-color: #FF0050;
      color: #FF0050;
    }
    .blur-indicator {
      position: absolute;
      top: calc(40 * var(--vh) / 19.2);
      right: calc(200 * var(--vw) / 10.8);
      padding: calc(6 * var(--vh) / 19.2) calc(12 * var(--vw) / 10.8);
      border-radius: calc(6 * var(--vw) / 10.8);
      font-size: calc(12 * var(--vw) / 10.8);
      font-weight: 600;
      z-index: 20;
      background: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(calc(4 * var(--vw) / 10.8));
      border: calc(1 * var(--vw) / 10.8) solid #333;
      color: #00F2EA;
      font-family: monospace;
      transition: all 0.2s ease;
    }
    .blur-indicator.blur-off {
      border-color: #FF0050;
      color: #FF0050;
    }
    @media (prefers-reduced-motion: reduce) {
      .live-badge { animation: none; }
    }
  </style>
</head>
<body>
  <iframe id="ome-frame" src="https://ome.tv" title="Ome.tv" allow="camera; microphone" sandbox="allow-scripts allow-same-origin allow-forms allow-popups"></iframe>
  <div class="blur-indicator" id="blur-indicator" title="Pressione 'B' para alternar blur">BLUR: ON</div>
  
  <div id="webcam-container">
    <video id="webcam" autoplay muted playsinline></video>
  </div>
  
  <div class="live-badge" aria-live="polite">AO VIVO</div>
  <div class="handle-label">@pedropaiva63</div>
  <div class="privacy-notice">Estranho desfocado por privacidade (RGPD)</div>
  <div class="connection-status disconnected" id="conn-status">Webcam: A conectar...</div>

  <script>
    const CONFIG_URL = 'config.json';
    let config = {};
    
    async function loadConfig() {
      try {
        const res = await fetch(CONFIG_URL, { cache: 'no-cache' });
        config = await res.json();
        applyConfig();
      } catch (e) {
        console.warn('Config não carregado, usando defaults', e);
      }
    }
    
    function applyConfig() {
      if (config.theme) {
        document.documentElement.style.setProperty('--primary', config.theme.primary);
        document.documentElement.style.setProperty('--blur-radius', config.theme.blurRadius || '8px');
      }
      if (config.layout?.webcam) {
        const wc = document.getElementById('webcam-container');
        Object.assign(wc.style, {
          top: config.layout.webcam.y + 'px',
          left: config.layout.webcam.x + 'px',
          width: config.layout.webcam.width + 'px',
          height: config.layout.webcam.height + 'px',
          borderRadius: config.layout.webcam.borderRadius + 'px',
          borderWidth: config.layout.webcam.borderWidth + 'px',
          borderColor: config.layout.webcam.borderColor
        });
      }
      if (config.layout?.liveBadge) {
        const lb = document.querySelector('.live-badge');
        Object.assign(lb.style, {
          top: config.layout.liveBadge.y + 'px',
          left: config.layout.liveBadge.x + 'px',
          fontSize: config.layout.liveBadge.fontSize + 'px',
          background: config.layout.liveBadge.background,
          color: config.layout.liveBadge.color
        });
        lb.textContent = config.layout.liveBadge.text;
      }
      if (config.layout?.handleLabel) {
        const hl = document.querySelector('.handle-label');
        Object.assign(hl.style, {
          top: config.layout.handleLabel.y + 'px',
          left: config.layout.handleLabel.x + 'px',
          fontSize: config.layout.handleLabel.fontSize + 'px'
        });
        hl.textContent = config.layout.handleLabel.text;
      }
      if (config.layout?.privacyNotice) {
        const pn = document.querySelector('.privacy-notice');
        Object.assign(pn.style, {
          bottom: (1920 - config.layout.privacyNotice.y - config.layout.privacyNotice.fontSize) + 'px',
          left: config.layout.privacyNotice.x + 'px',
          fontSize: config.layout.privacyNotice.fontSize + 'px'
        });
        pn.textContent = config.layout.privacyNotice.text;
      }
      if (config.urls?.ometv) {
        document.getElementById('ome-frame').src = config.urls.ometv;
      }
    }
    
    async function startWebcam() {
      const video = document.getElementById('webcam');
      const status = document.getElementById('conn-status');
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { width: { ideal: 720 }, height: { ideal: 1280 }, facingMode: 'user' },
          audio: false
        });
        video.srcObject = stream;
        await video.play();
        status.textContent = 'Webcam: Conectada ✓';
        status.className = 'connection-status connected';
      } catch (err) {
        console.error('Erro webcam:', err);
        status.textContent = 'Webcam: Erro - ' + err.name;
        status.className = 'connection-status disconnected';
      }
    }
    
    document.addEventListener('DOMContentLoaded', async () => {
      await loadConfig();
      startWebcam();
    });
    
    document.addEventListener('visibilitychange', () => {
      const video = document.getElementById('webcam');
      if (document.hidden) {
        video.pause();
      } else {
        video.play().catch(() => {});
      }
    });
    
    // Blur toggle (tecla B)
    let blurEnabled = true;
    const omeFrame = document.getElementById('ome-frame');
    const blurIndicator = document.getElementById('blur-indicator');
    
    function toggleBlur() {
      blurEnabled = !blurEnabled;
      omeFrame.style.filter = blurEnabled ? 'blur(var(--blur-radius))' : 'none';
      blurIndicator.textContent = blurEnabled ? 'BLUR: ON' : 'BLUR: OFF';
      blurIndicator.classList.toggle('blur-off', !blurEnabled);
      console.log('Blur:', blurEnabled ? 'ON' : 'OFF');
    }
    
    document.addEventListener('keydown', (e) => {
      if (e.key.toLowerCase() === 'b' && !e.target.matches('input, textarea')) {
        e.preventDefault();
        toggleBlur();
      }
    });
    
    // Também expõe para postMessage (controlo remoto)
    window.addEventListener('message', (e) => {
      if (e.data?.type === 'TOGGLE_BLUR') {
        toggleBlur();
      }
    });
  </script>
</body>
</html>
